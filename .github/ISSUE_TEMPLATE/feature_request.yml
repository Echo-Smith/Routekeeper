name: Feature request / 功能建议
description: Propose a focused, noncommercial improvement to safety, usability, accessibility or maintainability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Routekeeper is maintained for personal, noncommercial use. Proposals that
        bypass service controls, weaken isolation or expand credential/network
        access without a clear safety benefit will be declined.

        Routekeeper 仅面向个人非商业用途维护。规避服务控制、削弱隔离边界，或在
        没有明确安全收益时扩大凭据/网络访问能力的建议不会被接受。

  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe the user problem and who encounters it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change / 建议方案
      description: Explain the smallest change that would solve the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Primary area / 主要范围
      options:
        - Safety or privacy
        - Network verification
        - Experimental sandbox
        - User interface or workflow
        - Accessibility
        - Documentation
        - Build, signing or release
        - Maintainability
        - Other
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and boundaries / 风险与边界
      description: Note effects on network access, credentials, local files, permissions, tests or documentation.
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checks / 提交确认
      options:
        - label: I searched existing issues and proposals before opening this one.
          required: true
        - label: This request is for personal or noncommercial use and does not depend on bypassing service controls.
          required: true
        - label: I will not include credentials, cookies, tokens, real IP addresses or personal paths.
          required: true
